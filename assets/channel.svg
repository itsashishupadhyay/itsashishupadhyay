  <circle cx="1096" cy="33" r="2.4" fill="#00E5FF" filter="url(#glow)"/>
  <circle cx="1096" cy="33" r="5" fill="none" stroke="#00E5FF" stroke-width="1.2"><animate attributeName="r" values="4;16" begin="0s" dur="1.9s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;0" begin="0s" dur="1.9s" repeatCount="indefinite"/></circle><circle cx="1096" cy="33" r="5" fill="none" stroke="#00E5FF" stroke-width="1.2"><animate attributeName="r" values="4;16" begin="-0.95s" dur="1.9s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;0" begin="-0.95s" dur="1.9s" repeatCount="indefinite"/></circle>
