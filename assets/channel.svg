<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="t">
  <title id="t">Open a Channel — full duplex, no parity, no problem</title>
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e13"/><stop offset="1" stop-color="#12161d"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>
  <rect width="1200" height="110" rx="10" fill="url(#bgg)"/>
  <rect x="10" y="10" width="1180" height="90" rx="7" fill="none"
