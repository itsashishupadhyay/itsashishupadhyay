# Conway Twitty's Game of Life — replaces the contribution snake.
# Seeds a toroidal B3/S23 board from the contribution graph, simulates it
# (with cosmic-ray SEU revivals), and publishes the animated SVG to the
# output branch. New random seed every run = new colony every day.
name: Profile telemetry & Game of Life

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC — fresh seed, fresh colony
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write
# NOTE: no permissions key grants GITHUB_TOKEN traffic access — the traffic
# API needs push rights from a real PAT. Set METRICS_TOKEN to collect clones.

jobs:
  life:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Simulate the colony
        run: python3 scripts/game_of_life.py --user ${{ github.repository_owner }} --out dist/game-of-life.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # METRICS_TOKEN (a PAT with `repo` scope) unlocks traffic across every
      # repo; the default GITHUB_TOKEN only sees this one. Traffic panels
      # degrade gracefully without it rather than failing the run.
      - name: Sample telemetry
        run: python3 scripts/telemetry.py --user ${{ github.repository_owner }} --out dist/telemetry.svg --history dist/telemetry-history.json
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cards live on master (relative paths in the README), so commit them
      # back only when something actually changed. Commits made with
      # GITHUB_TOKEN don't re-trigger this workflow, so this can't loop.
      - name: Refresh project cards
        run: |
          python3 scripts/lab.py --user ${{ github.repository_owner }} --emit-markdown
          if ! git diff --quiet -- assets/projects; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/projects
            git commit -m "Refresh project cards [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
